<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fashion Bazar — Admin</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:#202938;background:#f4f6fb}*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:720px;margin:auto}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 20px #17255412}h1{margin:6px 0;font-size:25px}p{line-height:1.55;color:#586174}.notice{background:#fff4d6;padding:12px;border-radius:10px;color:#664b00}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea,button{width:100%;font:inherit;padding:12px;border:1px solid #d6dbe6;border-radius:10px}button{background:#176b52;color:white;border:0;font-weight:700;margin-top:14px;cursor:pointer}button.secondary{background:#e8edf5;color:#263247}button.danger{background:#a12d38}.hidden{display:none}.status{white-space:pre-wrap;margin-top:12px;font-weight:600}.item{border-top:1px solid #e5e9f1;padding:12px 0;display:flex;gap:12px;align-items:center}.item img{width:68px;height:68px;object-fit:cover;border-radius:10px;background:#eee}.item .info{flex:1;min-width:0}.item .info div{overflow-wrap:anywhere}.small{font-size:13px;color:#687386}code{overflow-wrap:anywhere}
</style>
</head>
<body><main class="wrap">
<div class="card"><h1>Fashion Bazar — Admin</h1><p>মোবাইল থেকে পণ্য যোগ ও মুছে ফেলার প্যানেল</p><div class="notice">সেটআপের আগে নিচের কোডে আপনার Supabase Project URL ও Publishable/anon key বসাতে হবে। <b>service_role/Secret key কখনো এখানে বসাবেন না।</b></div></div>
<section class="card" id="setup"><h2>১. Supabase সংযোগ</h2><label>Project URL</label><input id="projectUrl" placeholder="https://আপনার-project.supabase.co"><label>Publishable key (বা legacy anon key)</label><textarea id="publicKey" rows="3" placeholder="sb_publishable_... অথবা anon key"></textarea><button id="connect">সংযোগ করুন</button><div class="status" id="setupStatus"></div></section>
<section class="card hidden" id="login"><h2>২. অ্যাডমিন লগইন</h2><label>ইমেইল</label><input id="email" type="email" autocomplete="username"><label>পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password"><button id="signIn">লগইন</button><div class="status" id="loginStatus"></div></section>
<section class="card hidden" id="panel"><h2>৩. নতুন পণ্য যোগ করুন</h2><form id="productForm"><label>পণ্যের নাম *</label><input id="name" required maxlength="180"><label>বিবরণ</label><textarea id="description" rows="3"></textarea><div class="grid"><div><label>দাম (৳) *</label><input id="price" type="number" min="0" step="0.01" required></div><div><label>স্টক সংখ্যা</label><input id="stock" type="number" min="0" step="1" value="0"></div></div><label>ক্যাটাগরি</label><input id="category" placeholder="যেমন: শাড়ি, জামা, জুতা"><label>পণ্যের ছবি (JPG/PNG/WebP, সর্বোচ্চ 5MB)</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><button id="addProduct" type="submit">পণ্য সেভ করুন</button><div class="status" id="productStatus"></div></form><hr style="border:0;border-top:1px solid #e5e9f1;margin:22px 0"><h2>পণ্যের তালিকা</h2><button class="secondary" id="refresh">তালিকা রিফ্রেশ</button><div id="products"></div><button class="secondary" id="signOut">লগআউট</button></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let sb=null;const $=id=>document.getElementById(id);const status=(id,msg)=>$(id).textContent=msg;
$('connect').onclick=async()=>{const url=$('projectUrl').value.trim().replace(/\/$/,'');const key=$('publicKey').value.trim();if(!url||!key){status('setupStatus','Project URL এবং Publishable/anon key দুটোই দিন।');return}try{sb=window.supabase.createClient(url,key);const {error}=await sb.auth.getSession();if(error)throw error;status('setupStatus','সংযোগ তৈরি হয়েছে। এখন লগইন করুন।');$('login').classList.remove('hidden');$('setup').classList.add('hidden')}catch(e){status('setupStatus','সংযোগে সমস্যা: '+e.message)}};
$('signIn').onclick=async()=>{status('loginStatus','লগইন হচ্ছে…');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){status('loginStatus','লগইন হয়নি: '+error.message);return}status('loginStatus','লগইন সফল।');$('login').classList.add('hidden');$('panel').classList.remove('hidden');loadProducts()};
$('productForm').onsubmit=async e=>{e.preventDefault();const btn=$('addProduct');btn.disabled=true;status('productStatus','পণ্য সেভ হচ্ছে…');try{let image_url=null;const file=$('image').files[0];if(file){if(file.size>5*1024*1024)throw Error('ছবি 5MB-এর বেশি।');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('শুধু JPG, PNG বা WebP ছবি দিন।');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path='products/'+Date.now()+'_'+safe;const {error:upErr}=await sb.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(upErr)throw upErr;const {data}=sb.storage.from('product-images').getPublicUrl(path);image_url=data.publicUrl}
const row={name:$('name').value.trim(),description:$('description').value.trim(),price:Number($('price').value),stock:Number($('stock').value||0),category:$('category').value.trim(),image_url};const {error}=await sb.from('products').insert(row);if(error)throw error;$('productForm').reset();$('stock').value='0';status('productStatus','সফল! পণ্য যোগ হয়েছে।');await loadProducts()}catch(err){status('productStatus','সেভ হয়নি: '+err.message+'\nটেবিল/Storage policy এবং কলামগুলো পরীক্ষা করুন।')}finally{btn.disabled=false}};
async function loadProducts(){status('productStatus','');$('products').innerHTML='লোড হচ্ছে…';const {data,error}=await sb.from('products').select('id,name,price,stock,image_url,category').order('created_at',{ascending:false}).limit(100);if(error){$('products').textContent='তালিকা লোড হয়নি: '+error.message;return}if(!data.length){$('products').textContent='এখনো কোনো পণ্য নেই।';return}$('products').innerHTML='';for(const p of data){const item=document.createElement('div');item.className='item';if(p.image_url){const img=document.createElement('img');img.src=p.image_url;img.alt=p.name;item.appendChild(img)}const info=document.createElement('div');info.className='info';const title=document.createElement('b');title.textContent=p.name;const detail=document.createElement('div');detail.textContent='৳ '+p.price+' · স্টক: '+p.stock+(p.category?' · '+p.category:'');info.append(title,detail);item.appendChild(info);const del=document.createElement('button');del.className='danger';del.style.width='auto';del.textContent='মুছুন';del.onclick=async()=>{if(!confirm('এই পণ্যটি মুছবেন?'))return;const {error}=await sb.from('products').delete().eq('id',p.id);if(error)alert('মুছতে সমস্যা: '+error.message);else loadProducts()};item.appendChild(del);$('products').appendChild(item)}}
$('refresh').onclick=loadProducts;$('signOut').onclick=async()=>{await sb.auth.signOut();$('panel').classList.add('hidden');$('login').classList.remove('hidden');status('loginStatus','লগআউট হয়েছে।')};
</script></body></html>
